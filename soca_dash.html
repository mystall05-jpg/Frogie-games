<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SOCA DASH 🇹🇹</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:Arial,sans-serif; }
#ui { position:fixed; top:0; left:0; right:0; padding:10px; display:flex; justify-content:space-between; z-index:10; pointer-events:none; }
.stat { color:#FFD700; font-size:20px; font-weight:bold; text-shadow: 0 0 10px #FFD700; }
#title-screen { position:fixed; inset:0; background:linear-gradient(180deg,#1a0033,#ff4400,#FFD700); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; }
#title-screen h1 { font-size:48px; color:#FFD700; text-shadow:0 0 20px #ff4400, 0 0 40px #FFD700; animation:pulse 1s infinite; margin-bottom:10px; }
#title-screen p { color:white; font-size:18px; margin:5px; }
#tap-btn { margin-top:30px; padding:15px 40px; background:#FFD700; color:#000; border:none; border-radius:30px; font-size:22px; font-weight:bold; animation:bounce 0.8s infinite; cursor:pointer; }
#gameover { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:20; }
#gameover h2 { color:#ff4400; font-size:42px; text-shadow:0 0 20px #ff4400; }
#gameover p { color:white; font-size:20px; margin:10px; }
#restart-btn { margin-top:20px; padding:15px 40px; background:#FFD700; color:#000; border:none; border-radius:30px; font-size:20px; font-weight:bold; cursor:pointer; }
#game-canvas { position:fixed; inset:0; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
.particle { position:fixed; pointer-events:none; font-size:20px; animation:fly 0.8s forwards; z-index:15; }
@keyframes fly { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-80px) scale(0)} }
</style>
</head>
<body>
<div id="title-screen">
  <h1>🐸 SOCA DASH</h1>
  <p>🇹🇹 Trinidad Carnival Runner</p>
  <p style="color:#FFD700">Dodge obstacles • Collect coins</p>
  <button id="tap-btn" onclick="startGame()">🎭 TAP TO PLAY!</button>
  <p style="color:#aaa;margin-top:20px;font-size:14px">Made in Trinidad 🇹🇹</p>
</div>
<div id="ui" style="display:none">
  <div class="stat" id="lives">❤️❤️❤️</div>
  <div class="stat" id="score-display">0m</div>
  <div class="stat" id="coins-display">⭐0</div>
</div>
<canvas id="game-canvas"></canvas>
<div id="gameover">
  <h2>💀 GAME OVER</h2>
  <p id="final-score"></p>
  <p id="high-score"></p>
  <p id="final-coins"></p>
  <button id="restart-btn" onclick="startGame()">🔄 PLAY AGAIN</button>
  <p style="color:#FFD700;margin-top:20px;font-size:13px">Support Frogie Game Studio 🐸</p>
  <p style="color:#aaa;font-size:11px">ETH: 0xe38c9c51f57e2F636fEB9eF8371b84E829729424</p>
</div>
<script>
const canvas=document.getElementById('game-canvas');
const ctx=canvas.getContext('2d');
let W,H,ground,playerX,playerY,playerVY,jumping,doubleJumped;
let obstacles,coins,score,coinCount,lives,speed,frame,gameRunning,animId;
let bgStars=[];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;ground=H*0.78;}
resize();window.addEventListener('resize',resize);
function initGame(){playerX=W*0.15;playerY=ground;playerVY=0;jumping=false;doubleJumped=false;obstacles=[];coins=[];score=0;coinCount=0;lives=3;speed=4;frame=0;gameRunning=true;bgStars=[];for(let i=0;i<80;i++)bgStars.push({x:Math.random()*W,y:Math.random()*H*0.6,r:Math.random()*2+0.5,t:Math.random()*Math.PI*2});document.getElementById('ui').style.display='flex';document.getElementById('gameover').style.display='none';}
function jump(){if(!gameRunning)return;if(!jumping){playerVY=-H*0.022;jumping=true;playSound(300,0.1);}else if(!doubleJumped){playerVY=-H*0.02;doubleJumped=true;playSound(500,0.1);spawnParticles(playerX,playerY,'✨');}}
canvas.addEventListener('touchstart',e=>{e.preventDefault();jump();});
canvas.addEventListener('click',jump);
document.addEventListener('keydown',e=>{if(e.code==='Space')jump();});
function playSound(freq,vol){try{const ac=new AudioContext();const o=ac.createOscillator();const g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=freq;g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.2);o.start();o.stop(ac.currentTime+0.2);}catch(e){}}
function spawnParticles(x,y,emoji){for(let i=0;i<5;i++){const p=document.createElement('div');p.className='particle';p.textContent=emoji;p.style.left=(x+Math.random()*40-20)+'px';p.style.top=(y-20)+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),800);}}
function drawBackground(){const sky=ctx.createLinearGradient(0,0,0,ground);sky.addColorStop(0,'#0a0020');sky.addColorStop(0.5,'#1a0040');sky.addColorStop(1,'#cc2200');ctx.fillStyle=sky;ctx.fillRect(0,0,W,ground);bgStars.forEach(s=>{s.t+=0.02;ctx.fillStyle=`rgba(255,255,200,${0.5+0.5*Math.sin(s.t)})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});ctx.fillStyle='#0a0015';let bx=0;[0.1,0.2,0.08,0.25,0.15,0.18,0.12,0.22,0.09,0.2].forEach(h=>{const bw=W*0.12;ctx.fillRect(bx,ground-ground*h,bw,ground*h);bx+=bw*0.9;});const grd=ctx.createLinearGradient(0,ground,0,H);grd.addColorStop(0,'#cc0000');grd.addColorStop(0.3,'#880000');grd.addColorStop(1,'#440000');ctx.fillStyle=grd;ctx.fillRect(0,ground,W,H-ground);ctx.strokeStyle='#FFD700';ctx.lineWidth=3;ctx.shadowColor='#FFD700';ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(W,ground);ctx.stroke();ctx.shadowBlur=0;}
function drawPlayer(){const px=playerX,py=playerY,size=W*0.06;ctx.shadowColor='#00ffff';ctx.shadowBlur=jumping?20:10;ctx.fillStyle='#00cc88';ctx.beginPath();ctx.ellipse(px,py-size*0.6,size*0.5,size*0.6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(px-size*0.18,py-size*0.85,size*0.15,0,Math.PI*2);ctx.arc(px+size*0.18,py-size*0.85,size*0.15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(px-size*0.15,py-size*0.85,size*0.08,0,Math.PI*2);ctx.arc(px+size*0.15,py-size*0.85,size*0.08,0,Math.PI*2);ctx.fill();if(frame%10<5){ctx.fillStyle='#FFD700';ctx.beginPath();ctx.moveTo(px,py-size*1.2);ctx.lineTo(px-size*0.3,py-size*1.8);ctx.lineTo(px+size*0.3,py-size*1.8);ctx.fill();ctx.fillStyle='#ff4400';ctx.beginPath();ctx.moveTo(px,py-size*1.1);ctx.lineTo(px-size*0.5,py-size*1.6);ctx.lineTo(px-size*0.1,py-size*1.5);ctx.fill();ctx.beginPath();ctx.moveTo(px,py-size*1.1);ctx.lineTo(px+size*0.5,py-size*1.6);ctx.lineTo(px+size*0.1,py-size*1.5);ctx.fill();}ctx.shadowBlur=0;}
function gameOver(){gameRunning=false;cancelAnimationFrame(animId);document.getElementById('ui').style.display='none';const go=document.getElementById('gameover');go.style.display='flex';document.getElementById('final-score').textContent='📏 Distance: '+Math.floor(score)+'m';document.getElementById('final-coins').textContent='⭐ Coins: '+coinCount;const hs=Math.max(parseInt(localStorage.getItem('hs')||0),Math.floor(score));localStorage.setItem('hs',hs);document.getElementById('high-score').textContent='🏆 Best: '+hs+'m';playSound(150,0.3);}
function gameLoop(){if(!gameRunning)return;animId=requestAnimationFrame(gameLoop);frame++;ctx.clearRect(0,0,W,H);drawBackground();playerVY+=H*0.001;playerY+=playerVY;if(playerY>=ground){playerY=ground;playerVY=0;jumping=false;doubleJumped=false;}if(frame%300===0)speed+=0.5;score+=speed*0.05;if(frame%Math.max(60,120-Math.floor(score/50))===0){const h=H*0.08+Math.random()*H*0.08;obstacles.push({x:W+50,y:ground,w:W*0.06,h:h});}if(frame%45===0)coins.push({x:W+50,y:ground-H*0.1-Math.random()*H*0.2});obstacles=obstacles.filter(o=>{o.x-=speed;ctx.fillStyle='#ff2200';ctx.shadowColor='#ff0000';ctx.shadowBlur=15;ctx.font=(o.w*0.6*2)+'px Arial';ctx.textAlign='center';ctx.fillText('🥁',o.x,o.y-o.h*0.3);ctx.shadowBlur=0;const px=playerX,py=playerY,size=W*0.05;if(Math.abs(px-o.x)<o.w*0.7&&py-size*1.2<o.y&&py>o.y-o.h){lives--;spawnParticles(px,py,'💥');playSound(100,0.4);if(lives<=0){gameOver();return false;}return false;}return o.x>-50;});coins=coins.filter(c=>{c.x-=speed;ctx.save();ctx.translate(c.x,c.y);ctx.rotate(frame*0.1);ctx.font=(W*0.05)+'px Arial';ctx.textAlign='center';ctx.fillText('⭐',0,8);ctx.restore();const px=playerX,py=playerY;if(Math.abs(px-c.x)<W*0.06&&Math.abs(py-c.y)<H*0.08){coinCount++;spawnParticles(c.x,c.y,'⭐');playSound(600,0.1);return false;}return c.x>-50;});drawPlayer();const hearts=['❤️','❤️','❤️'].slice(0,lives).join('')+['🖤','🖤','🖤'].slice(0,3-lives).join('');document.getElementById('lives').textContent=hearts;document.getElementById('score-display').textContent=Math.floor(score)+'m';document.getElementById('coins-display').textContent='⭐'+coinCount;}
function startGame(){document.getElementById('title-screen').style.display='none';if(animId)cancelAnimationFrame(animId);initGame();gameLoop();}
</script>
</body>
</html>

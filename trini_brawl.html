<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TRINI BRAWL</title>
<style>
    html,body{
        margin:0; padding:0; overflow:hidden; height:100%; background:#000;
        font-family: 'Press Start 2P', cursive;
    }
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    #gameCanvas{
        background: linear-gradient(to bottom, #b30000 0%, #ff6600 30%, #000 100%);
        display:block;
    }
    #ui{
        position:absolute; top:10px; left:10px; right:10px;
        color:#fff; text-align:center; pointer-events:none;
        font-size:14px;
    }
    .bar{
        width:200px; height:15px; border:2px solid #fff; margin:5px auto;
        background:#444;
    }
    .fill{
        height:100%; background:#0f0;
    }
    #shopBtn{
        position:absolute; bottom:10px; right:10px; padding:8px 12px;
        background:#0a0; color:#fff; border:none; border-radius:5px;
        font-size:12px; cursor:pointer; pointer-events:auto;
    }
    #overlay{
        position:absolute; top:0; left:0; right:0; bottom:0;
        background:rgba(0,0,0,0.8); color:#fff; display:flex;
        align-items:center; justify-content:center; flex-direction:column;
        font-size:24px; text-align:center; z-index:10;
    }
    #overlay button{
        margin-top:20px; padding:10px 20px; font-size:18px;
        background:#ff0; color:#000; border:none; cursor:pointer;
    }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div class="bar"><div id="playerHealth" class="fill"></div></div>
    <div class="bar"><div id="enemyHealth" class="fill" style="background:#f00;"></div></div>
</div>
<button id="shopBtn">Shop (ETH)</button>
<div id="overlay">
    <div id="msg">TRINI BRAWL</div>
    <button id="startBtn">Tap to Start</button>
</div>

<script>
(() => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const playerHealthBar = document.getElementById('playerHealth');
    const enemyHealthBar = document.getElementById('enemyHealth');
    const overlay = document.getElementById('overlay');
    const msg = document.getElementById('msg');
    const startBtn = document.getElementById('startBtn');
    const shopBtn = document.getElementById('shopBtn');

    // Resize canvas
    function resize(){
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Audio setup
    const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    function playTone(freq, dur, type='sine'){
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
        osc.stop(audioCtx.currentTime+dur);
    }
    function punchSound(){ playTone(200,0.1,'square'); }
    function specialSound(){ playTone(100,0.3,'triangle'); }

    // Game variables
    let gameState = 'menu'; // menu, playing, gameover, victory
    let player, enemies, boss, wave, score, playerHealth, enemyHealth;
    const playerSpeed = 4;
    const enemySpeedBase = 1.5;
    const maxWaves = 3;

    function initGame(){
        player = {x:50, y:canvas.height-120, w:50, h:100, health:100, dir:1};
        enemies = [];
        boss = null;
        wave = 1;
        score = 0;
        playerHealth = 100;
        enemyHealth = 0;
        spawnWave();
    }

    function spawnWave(){
        const count = wave*2+2;
        for(let i=0;i<count;i++){
            const e = {
                x: canvas.width + i*120,
                y: canvas.height-120,
                w:50,
                h:100,
                health: wave*30,
                maxHealth: wave*30,
                speed: enemySpeedBase + wave*0.3,
                type:'enemy'
            };
            enemies.push(e);
        }
        enemyHealth = 0; // No boss yet
    }

    function spawnBoss(){
        boss = {
            x: canvas.width,
            y: canvas.height-150,
            w:80,
            h:150,
            health: 300,
            maxHealth:300,
            speed: 2,
            type:'boss'
        };
        enemyHealth = boss.health;
    }

    function update(){
        // player health clamp
        player.health = Math.max(0, player.health);
        // move enemies
        enemies.forEach(e=>{ e.x -= e.speed; });
        // remove passed enemies
        enemies = enemies.filter(e=>e.x+e.w>0);
        // collision with player
        enemies.forEach(e=>{
            if (e.x < player.x+player.w && e.x+e.w > player.x &&
                e.y < player.y+player.h && e.y+e.h > player.y){
                player.health -= 0.2;
                e.health -= 0.1;
                if(e.health<=0) score+=10;
            }
        });
        // boss actions
        if(boss){
            boss.x -= boss.speed;
            if(boss.x < canvas.width/2) boss.x = canvas.width/2;
            // collision with player
            if (boss.x < player.x+player.w && boss.x+boss.w > player.x &&
                boss.y < player.y+player.h && boss.y+boss.h > player.y){
                player.health -= 0.3;
            }
        }

        // Clean dead enemies
        enemies = enemies.filter(e=>e.health>0);
        // Update health bars
        playerHealthBar.style.width = (player.health/100*100)+'%';
        if(boss){
            enemyHealthBar.style.width = (boss.health/boss.maxHealth*100)+'%';
        } else if(enemies.length){
            // Show average health of enemies
            const avg = enemies.reduce((s,e)=>s+e.health,0)/enemies.length;
            enemyHealthBar.style.width = (avg/ (wave*30) *100)+'%';
        } else {
            enemyHealthBar.style.width = '0%';
        }

        // Wave progression
        if(enemies.length===0 && !boss){
            if(wave<maxWaves){
                wave++;
                spawnWave();
            } else {
                spawnBoss();
            }
        }
        // Boss defeated?
        if(boss && boss.health<=0){
            gameState='victory';
            msg.innerHTML='VICTORY!<br>Score: '+score;
            overlay.style.display='flex';
        }
        // Player dead?
        if(player.health<=0){
            gameState='gameover';
            msg.innerHTML='GAME OVER<br>Score: '+score;
            overlay.style.display='flex';
        }
    }

    function draw(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        // Draw player
        ctx.fillStyle='#0ff';
        ctx.fillRect(player.x, player.y, player.w, player.h);
        // Draw enemies
        ctx.fillStyle='#f00';
        enemies.forEach(e=>{ ctx.fillRect(e.x,e.y,e.w,e.h); });
        // Draw boss
        if(boss){
            ctx.fillStyle='#ff0';
            ctx.fillRect(boss.x,boss.y,boss.w,boss.h);
        }
    }

    function loop(){
        if(gameState==='playing'){
            update();
            draw();
        }
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // Controls
    function handleTouch(x){
        const w = canvas.width;
        if(x< w*0.33){
            // left side - move left & punch
            player.x = Math.max(0, player.x - playerSpeed);
            // punch
            punchSound();
            enemies.forEach(e=>{ if(e.x < player.x+player.w && e.x+e.w > player.x-player.w && Math.abs(e.y-player.y)<30) e.health-=20; });
        }else if(x> w*0.66){
            // right side - move right & punch
            player.x = Math.min(w-player.w, player.x + playerSpeed);
            punchSound();
            enemies.forEach(e=>{ if(e.x < player.x+player.w*2 && e.x+e.w > player.x+player.w && Math.abs(e.y-player.y)<30) e.health-=20; });
        }else{
            // center - special
            specialSound();
            if(boss){
                boss.health -= 50;
            }else{
                enemies.forEach(e=>e.health-=30);
            }
        }
    }

    canvas.addEventListener('touchstart',e=>{
        e.preventDefault();
        const touch = e.changedTouches[0];
        handleTouch(touch.clientX);
    });
    canvas.addEventListener('mousedown',e=>{
        handleTouch(e.clientX);
    });

    startBtn.addEventListener('click',()=>{
        overlay.style.display='none';
        gameState='playing';
        initGame();
    });

    // Restart after game over/victory
    overlay.addEventListener('click',e=>{
        if(e.target.tagName==='BUTTON') return;
        overlay.style.display='none';
        gameState='playing';
        initGame();
    });

    // Shop button
    shopBtn.addEventListener('click',()=>{
        window.open('https://etherscan.io/address/0xe38c9c51f57e2F636fEB9eF8371b84E829729424','_blank');
    });
})();
</script>
</body>
</html>

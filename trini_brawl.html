<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TRINI BRAWL</title>
<style>
    body{margin:0;overflow:hidden;background:#111;display:flex;justify-content:center;align-items:center;height:100vh;}
    canvas{display:block;background:#222;}
    #overlay{position:absolute;top:0;left=0;width:100%;height:100%;background:rgba(0,0,0,0.7);color:#fff;flex-direction:column;align-items:center;justify-content:center;display:none;font-family:Arial,sans-serif;z-index:10;}
    #overlay button{margin-top:20px;padding:10px 20px;font-size:1.2rem;cursor:pointer;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="overlay">
    <div id="overlayText"></div>
    <button id="overlayBtn">Tap to Start</button>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let audioCtx = null;
let backgroundInterval = null;

// ----- Audio -----
function initAudio(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    startBackgroundBeat();
}
function playPunch(){
    if(!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type='square';
    o.frequency.setValueAtTime(200,audioCtx.currentTime);
    o.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.1);
    g.gain.setValueAtTime(0,audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.5,audioCtx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.1);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.2);
}
function playSpecial(){
    if(!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(200,audioCtx.currentTime);
    o.exponentialRampToValueAtTime(800,audioCtx.currentTime+0.3);
    g.gain.setValueAtTime(0,audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.4,audioCtx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.3);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.4);
}
function playEnemyHit(){
    if(!audioCtx) return;
    const buffer = audioCtx.createBuffer(2, audioCtx.sampleRate*0.05, audioCtx.sampleRate);
    const left = buffer.getChannelData(0);
    const right = buffer.getChannelData(1);
    for(let i=0;i<buffer.length;i++){
        const noise = (Math.random()*2-1)*0.5;
        left[i]=noise;
        right[i]=noise;
    }
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.05);
    source.connect(g); g.connect(audioCtx.destination);
    source.start(); source.stop(audioCtx.currentTime+0.06);
}
function playStageClear(){
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    const notes = [261.63,329.63,392.00]; // C4 E4 G4
    notes.forEach((freq,i)=>{
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type='sine';
        o.frequency.setValueAtTime(freq, now+i*0.15);
        g.gain.setValueAtTime(0, now+i*0.15);
        g.gain.linearRampToValueAtTime(0.2, now+i*0.15+0.01);
        g.gain.exponentialRampToValueAtTime(0.001, now+i*0.15+0.2);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(now+i*0.15+0.2);
    });
}
function startBackgroundBeat(){
    stopBackgroundBeat();
    backgroundInterval = setInterval(()=>{
        if(!audioCtx) return;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type='sine';
        o.frequency.value = 110;
        g.gain.setValueAtTime(0, audioCtx.currentTime);
        g.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime+0.01);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.2);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime+0.2);
    },500);
}
function stopBackgroundBeat(){ if(backgroundInterval) clearInterval(backgroundInterval); }

// ----- Game Objects -----
class Player{
    constructor(){this.w=60;this.h=80;this.x=canvas.width/2-this.w/2;this.y=canvas.height-this.h-20;this.maxHealth=100;this.health=this.maxHealth;this.color='#0f0';}
    draw(){
        ctx.fillStyle=this.color;
        ctx.fillRect(this.x,this.y,this.w,this.h);
        // feather
        ctx.fillStyle='#ff0';
        ctx.beginPath();
        ctx.moveTo(this.x+this.w/2,this.y);
        ctx.lineTo(this.x+this.w/2-10,this.y-20);
        ctx.lineTo(this.x+this.w/2+10,this.y-20);
        ctx.fill();
    }
}
class Enemy{
    constructor(stage,isBoss=false,isMiniBoss=false){
        this.w = isBoss?120:isMiniBoss?100:60+Math.random()*40;
        this.h = isBoss?150:isMiniBoss?130:80+Math.random()*40;
        this.x = canvas.width+this.w;
        this.y = canvas.height-this.h-20-Math.random()*100;
        this.speed = 1+Math.random()*1.5;
        if(isBoss) this.speed*=0.5;
        this.health = isBoss?30:isMiniBoss?20:5+Math.floor(Math.random()*3);
        this.maxHealth=this.health;
        this.color = isBoss?'#ff0':isMiniBoss?'#ff8800':'#f00';
        this.type = isBoss?'boss':isMiniBoss?'miniBoss':'enemy';
    }
    update(){this.x-=this.speed;}
    draw(){
        ctx.fillStyle=this.color;
        ctx.fillRect(this.x,this.y,this.w,this.h);
        // health bar
        const bw=this.w,bh=5;
        ctx.fillStyle='#000';
        ctx.fillRect(this.x,this.y-bh-2,bw,bh);
        ctx.fillStyle='#0f0';
        ctx.fillRect(this.x,this.y-bh-2,bw*(this.health/this.maxHealth),bh);
    }
}

// ----- Game State -----
let player = new Player();
let enemies = [];
let stage = 1;
let score = 0;
let gameOver = false;
let victory = false;
let enemiesToSpawn = [];
let lastSpawn = 0;
const spawnInterval = 1200;

// Stage colors and scroll speeds
const stageColors = ['#222','#660066','#006600'];
const stageScrollSpeeds = [1,2,1.5];
let bgOffset = 0;

// ----- Input -----
function handleTouch(e){
    initAudio();
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touchX = e.touches[0].clientX - rect.left;
    const third = canvas.width/3;
    const hitLeft = touchX < third;
    const hitRight = touchX > 2*third;
    const hitSpecial = !hitLeft && !hitRight;
    if(hitLeft) playerPunch('left');
    else if(hitRight) playerPunch('right');
    else if(hitSpecial) playerSpecial();
}
function handleMouse(e){
    initAudio();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const third = canvas.width/3;
    const hitLeft = mx < third;
    const hitRight = mx > 2*third;
    const hitSpecial = !hitLeft && !hitRight;
    if(e.type==='mousedown'){
        if(hitLeft) playerPunch('left');
        else if(hitRight) playerPunch('right');
        else if(hitSpecial) playerSpecial();
    }
}
canvas.addEventListener('touchstart',handleTouch,{passive:false});
canvas.addEventListener('mousedown',handleMouse);

// ----- Player Actions -----
function playerPunch(side){
    playPunch();
    const reach = 80;
    const bx = side==='left'?player.x-reach:player.x+player.w;
    const by = player.y;
    const bw = reach;
    const bh = player.h;
    enemies.forEach(en=>{
        if(en.x < bx+bw && en.x+en.w > bx && en.y < by+bh && en.y+en.h > by){
            en.health -= 20;
            if(en.health<=0){ defeatEnemy(en); }
            else{ playEnemyHit(); }
        }
    });
}
function playerSpecial(){
    playSpecial();
    const cx = player.x+player.w/2;
    const cy = player.y+player.h/2;
    const radius = 150;
    enemies.forEach(en=>{
        const dx = (en.x+en.w/2)-cx;
        const dy = (en.y+en.h/2)-cy;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist<radius){
            en.health -= 40;
            if(en.health<=0){ defeatEnemy(en); }
            else{ playEnemyHit(); }
        }
    });
}
function defeatEnemy(en){
    const idx = enemies.indexOf(en);
    if(idx>-1) enemies.splice(idx,1);
    score += 10;
    playEnemyHit();
}

// ----- Stage Management -----
function startStage(){
    enemiesToSpawn = [];
    if(stage===1){
        for(let i=0;i<5;i++) enemiesToSpawn.push(new Enemy(1));
    }else if(stage===2){
        for(let i=0;i<8;i++) enemiesToSpawn.push(new Enemy(2));
        enemiesToSpawn.push(new Enemy(2,false,true)); // mini boss
    }else if(stage===3){
        for(let i=0;i<10;i++) enemiesToSpawn.push(new Enemy(3));
        enemiesToSpawn.push(new Enemy(3,true,false)); // boss
    }
    lastSpawn = 0;
    bgOffset = 0;
}
function spawnEnemy(){
    if(enemiesToSpawn.length===0) return;
    const now = performance.now();
    if(now-lastSpawn<spawnInterval) return;
    enemies.push(enemiesToSpawn.shift());
    lastSpawn = now;
}

// ----- Update & Render -----
function update(){
    if(gameOver||victory) return;
    spawnEnemy();
    enemies.forEach(en=>en.update());
    // remove off-screen
    enemies = enemies.filter(en=>en.x+en.w>-20);

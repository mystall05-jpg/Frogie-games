name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Get version info
        id: version
        run: |
          echo "date=$(date +'%Y%m%d_%H%M')" >> $GITHUB_OUTPUT
          echo "run=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm install

      - name: Build APK with Capacitor
        run: |
          npx cap add android
          npx cap copy android
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Rename APK with version
        run: |
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             releases/FrogieGames_v${{ github.run_number }}_${{ steps.version.outputs.date }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: FrogieGames_v${{ github.run_number }}_${{ steps.version.outputs.date }}
          path: releases/*.apk
          retention-days: 90

      - name: Commit APK to releases folder
        run: |
          git config user.email "frogie@games.tt"
          git config user.name "Frogie Bot"
          git add releases/
          git diff --staged --quiet || git commit -m "📱 APK v${{ github.run_number }} - ${{ steps.version.outputs.date }}"
          git push
